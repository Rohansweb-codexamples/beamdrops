<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BeamDrop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <div class="radar-dot"></div>
      <span>BeamDrop</span>
    </div>
    <span id="selfId"></span>
  </header>

  <main class="main-area">

    <!-- Radar + Devices -->
    <section class="radar-area">
      <div class="radar">
        <div class="radar-sweep"></div>
      </div>
      <ul id="peerList" class="device-list"></ul>
    </section>

    <!-- Chat + File -->
    <section class="side-panel">
      <h2>Connection</h2>
      <p id="connStatus">Not connected</p>

      <div class="chat-box">
        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">
          <input id="chatText" type="text" placeholder="Type a message..." />
          <button id="sendMsgBtn">Send</button>
        </div>
      </div>

      <h3>Send File</h3>
      <input type="file" id="fileInput" />
      <button id="sendFileBtn" disabled>Send file</button>

      <h3>Transfers</h3>
      <div id="transfers"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
