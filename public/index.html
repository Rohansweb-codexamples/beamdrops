<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BeamDrop</title>
  <link id="favicon" rel="icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <div class="radar-dot"></div>
      <span>BeamDrop</span>
    </div>

    <div class="top-right">
      <span id="selfId"></span>
      <button id="themeToggle">Theme</button>
    </div>
  </header>

  <main class="main-area">

    <!-- Radar + Tower + Sparks -->
    <section class="radar-area">
      <div class="tower">
        <div class="tower-base"></div>
        <div class="tower-body"></div>
        <div class="tower-platform"></div>
        <div class="tower-top"></div>
      </div>

      <div class="spark-container"></div>

      <div class="radar-wrap">
        <div class="radar">
          <div class="radar-grid"></div>
          <div class="radar-sweep"></div>
        </div>
        <ul id="peerList" class="device-list"></ul>
      </div>
    </section>

    <!-- Side Panel -->
    <section class="side-panel">

      <h2>Identity</h2>
      <div class="username-box">
        <input id="usernameInput" placeholder="Enter name…" />
        <button id="setNameBtn">Set</button>
      </div>

      <h2>Connection</h2>
      <p id="connStatus">Not connected</p>

      <h2>Chat</h2>
      <div class="chat-box">
        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">
          <input id="chatText" type="text" placeholder="Type a message…" />
          <button id="sendMsgBtn">Send</button>
        </div>
      </div>

      <h2>Send File</h2>
      <input type="file" id="fileInput" />
      <button id="sendFileBtn" disabled>Send File</button>

      <h2>Transfers</h2>
      <div id="transfers"></div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
