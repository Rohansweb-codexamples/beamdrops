<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Audio Stream Playlist</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px 20px; }
        .player-card { max-width: 450px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #1db954; }
        audio { width: 100%; margin: 20px 0; }
        .track-list { text-align: left; background: #282828; border-radius: 8px; max-height: 200px; overflow-y: auto; padding: 10px; margin-top: 20px; }
        .track-item { padding: 10px; border-bottom: 1px solid #3e3e3e; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .track-item:hover { background: #383838; }
        .track-item.active { background: #1db954; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>🎵 Custom Audio Player</h2>
    <div id="now-playing" style="font-weight: bold; margin-bottom: 10px;">Loading tracks...</div>
    
    <!-- Native Browser Audio Controller -->
    <audio id="audio-player" controls autoplay></audio>

    <h3>Playlist Queue</h3>
    <div class="track-list" id="playlist-container"></div>
</div>

<script>
    const player = document.getElementById('audio-player');
    const container = document.getElementById('playlist-container');
    const statusText = document.getElementById('now-playing');
    
    let playlist = [];
    let currentIndex = 0;

    // Fetch the list of audio files from the node backend
    async function loadPlaylist() {
        try {
            const response = await fetch('/api/playlist');
            playlist = await response.json();
            
            if (playlist.length === 0) {
                statusText.innerText = "No audio tracks found. Upload tracks to public/audio/";
                return;
            }
            
            renderPlaylist();
            playTrack(0);
        } catch (err) {
            statusText.innerText = "Error loading music playlist.";
        }
    }

    // Render interactive track elements in UI
    function renderPlaylist() {
        container.innerHTML = '';
        playlist.forEach((track, index) => {
            const item = document.createElement('div');
            item.className = `track-item ${index === currentIndex ? 'active' : ''}`;
            item.innerText = `${index + 1}. ${track.replace(/\.[^/.]+$/, "")}`; // Strips file extension for clean view
            item.onclick = () => playTrack(index);
            container.appendChild(item);
        });
    }

    // Load track and command browser engine to play
    function playTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        
        // Target the absolute file location served by Express
        player.src = `/audio/${playlist[currentIndex]}`;
        statusText.innerText = `Now Playing: ${playlist[currentIndex].replace(/\.[^/.]+$/, "")}`;
        
        renderPlaylist();
        player.play().catch(e => console.log("Autoplay blocked by browser. Click Play to start."));
    }

    // CRITICAL: Automatically catch the end of a song and fire the next track execution index
    player.addEventListener('ended', () => {
        if (currentIndex + 1 < playlist.length) {
            playTrack(currentIndex + 1); // Advance to next song
        } else {
            playTrack(0); // Optional Loop: Restart playlist back at track 1
        }
    });

    // Run pipeline setup on layout load
    loadPlaylist();
</script>
</body>
</html>
